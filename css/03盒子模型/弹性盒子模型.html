<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1 {
            width: 700px;
            height: 1000px;
            background-color: #555;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .d1 {
            width: 200px;
            height: 100px;
            background-color: #f00;
            flex: 1;
        }

        .d2 {
            width: 200px;
            height: 100px;
            background-color: #0f0;
            flex: 3;
        }

        .d3 {
            width: 200px;
            height: 100px;
            background-color: #00f;
            flex: 3;
        }
    </style>



</head>

<body>
    <div class="box1">
        <div class="d1">
            <p>内容1</p>
        </div>
        <div class="d2">
            <p>内容2</p>
        </div>
        <div class="d3">
            <p>内容3</p>
        </div>


    </div>



</body>

</html>
