<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 300px;
            height: 300px;
            background-color: blue;
            border-radius: 20%;
            /*圆角命令，圆角定义为圆半径，可以用10PX精确数值，可以用%定比例*/
            margin: 0 auto;
            /* 块外行间隔，上下为0，左右为自动分配 */
            box-shadow: -50px 0 30px rgba(94, 25, 25, 0.8);
            /* 添加阴影的属性，阴影下有4个属性需要配置，依次为h-shadow水平阴影位置，v-shadow垂直阴影位置，blur模糊距离（即模糊度，可空置），color阴影颜色、透明度（可空置） */
        }
    </style>
</head>

<body>
    <div>
        <div class="box">

        </div>
    </div>






</body>

</html>
