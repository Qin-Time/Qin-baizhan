<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p>此处为段落标签的文本显示，以下才是文本正确的六种标签</p>
    <em>此标签为着重定义的文本</em>
    <i>此标签为定义斜体文本</i>
    <b>此变迁为定义粗体文本</b>
    <strong>此标签为定义加重语气，重要文本 </strong>
    <del>此标签为定义划线文本，即删除文本</del>
    <span>此标签为没有特定元素的文本，为以后css样式使用改变文本样式</span>

</body>

</html>
