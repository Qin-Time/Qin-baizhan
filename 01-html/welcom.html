<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <p align="center">此处是段落标签，右侧align即位置属性，紧接着为属性值</p>
    <p>段落标签快捷输入方式，输入P之后回车，程序会自动补全前后代码。方式二，输入P然后TAB键程序会自动补全</p>
    <p>文本内容中想要换行，可以插入单标签，为<br>，实现单段文本内的换行</p>
    <hr color="red" width="700px" size="30px" align="left">
    <p>以上为水平线标签，内容为水平线赋值，颜色，长度，尺寸，位置（默认为居中）</p>
    <img src="1212.jfif" alt="图片的说明，当图片路径丢失时可显示" width="300px" height="240px" title="悬停提示">
    <p>img标签为单标签。以上为图片标签的使用，src属性指引图片名称，图片路径需要在该项目同一个文件夹下。alt属性内为替代文本，可作说明。width为宽度。height为高度。title为鼠标悬停提示文本</p>
</body>

</html>
