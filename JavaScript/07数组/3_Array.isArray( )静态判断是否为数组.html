    <script>
        var nu = 10;
        var ar = [20,20,50];
        console.log(typeof nu);        //typeof 判断数值的类型，数值型num、字符串型string、布尔型boolean、对象型object
        console.log(typeof true);
        console.log(typeof ar);         //  ！！！非正确判断，会返回object对象类型
        console.log(Array.isArray(ar)); //判断数据类型是否为数组。返回值是布尔值
        
    </script>
