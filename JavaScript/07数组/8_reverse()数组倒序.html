    <script>

        //arr.reverse() 无参数，可将数组的下标翻转，返回该数组，已发生倒序
        let arr1 = [1, 2, 3, 4, 5, 6];
        console.log(arr1.reverse());

        //练习将字符串倒序
        let text = '此段文本将要倒过来读';
        let textend = '';
        let arrtemp = text.split('');
        console.log(arrtemp);
        arrtemp.reverse();
        console.log(arrtemp);
        console.log(arrtemp.join('-'));


    </script>
