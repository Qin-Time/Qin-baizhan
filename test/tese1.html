<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function addSmart(a) {
            let sum = a;

            function inner(b) {
                if (b === undefined) return sum; // 如果不传参，直接返回结果
                sum += b;
                return inner;
            }

            // 提供显式获取方法
            inner.value = () => sum;

            return inner;
        }


        function add(a) {
            // 1. 初始化总和
            let sum = a;

            // 2. 定义内部函数，用于接收下一个参数
            function inner(b) {
                sum += b;      // 累加
                return inner;  // 🔑 关键：返回自己，实现链式调用
            }

            // 3. 【核心魔法】重写 toString 和 valueOf
            // 当 JS 引擎试图把这个函数转换成原始值（如打印、相加、比较）时，会调用这两个方法
            inner.toString = function () {
                return sum;
            };

            inner.valueOf = function () {
                return sum;
            };

            // 4. 返回这个带有“魔法”的函数
            return inner;
        }

        // --- 测试环节 ---

        // 1. 链式调用
        const result = add(1)(2)(3)(4)(5);
        console.log(result);
        // 👉 输出: 15 
        // (原理：console.log 隐式调用了 result.toString())

        // 2. 参与数学运算
        const total = add(10)(20) + 5;
        // 👉 输出: 35
        // (原理：加法运算隐式调用了 result.valueOf())

        // 3. 比较运算
        console.log(add(5)(5) === 10);
        // 👉 输出: true

        // 4. 单独调用
        console.log(add(100));
        // 👉 输出: 100
    </script>
</body>

</html>
