<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    console.log("=== 验证数组的真实状态 ===");
    var arr1 = [];
    console.log("1. 初始数组:", arr1);
    console.log("   typeof arr1:", typeof arr1);
    console.log("   Array.isArray(arr1):", Array.isArray(arr1));
    console.log("   arr1.length:", arr1.length);
    console.log("   arr1[0]:", arr1[0]);

    arr1.push('添加内容1');
    console.log("2. 添加元素后:");
    console.log("   arr1:", arr1);
    console.log("   arr1.length:", arr1.length);
    console.log("   arr1[0]:", arr1[0]);
    console.log("   arr1[1]:", arr1[1]);
    console.log("   实际遍历:");
    for (var i = 0; i < arr1.length; i++) {
        console.log("     [" + i + "] = " + arr1[i]);
    }

    var newLength = arr1.push("添加内容2");
    console.log("3. 再次添加元素后:");
    console.log("   arr1:", arr1);
    console.log("   arr1.length:", arr1.length);
    console.log("   返回的新长度:", newLength);
    console.log("   arr1[0]:", arr1[0]);
    console.log("   arr1[1]:", arr1[1]);

    arr1.push(3, true);
    console.log("4. 添加更多元素:");
    console.log("   arr1:", arr1);
    console.log("   arr1.length:", arr1.length);

    // 用不同方法验证数组内容
    console.log("5. 通过索引访问验证:");
    for (var i = 0; i < arr1.length; i++) {
        console.log("   [" + i + "] = " + arr1[i] + " (typeof: " + typeof arr1[i] + ")");
    }

    console.log("6. 使用Array.from转换后验证:");
    var converted = Array.from(arr1);
    console.log("   转换后的数组:", converted);
    console.log("   转换后长度:", converted.length);

    console.log("7. 使用扩展运算符验证:");
    var spread = [...arr1];
    console.log("   扩展后的数组:", spread);
    console.log("   扩展后长度:", spread.length);

    console.log("8. JSON序列化验证:");
    console.log("   JSON.stringify(arr1):", JSON.stringify(arr1));

    console.log("9. pop操作验证:");
    while (arr1.length > 0) {
        var popped = arr1.pop();
        console.log("   弹出:", popped, "剩余长度:", arr1.length, "剩余数组:", Array.from(arr1));
    }

    console.log("=== 特殊情况测试 ===");
    // 创建一个可能有问题的对象
    var specialArray = [];
    specialArray[0] = "first";
    specialArray[2] = "third"; // 跳过索引1，创建稀疏数组
    console.log("稀疏数组:", specialArray);
    console.log("稀疏数组长度:", specialArray.length);
    console.log("specialArray[0]:", specialArray[0]);
    console.log("specialArray[1]:", specialArray[1]); // undefined
    console.log("specialArray[2]:", specialArray[2]);
</script>

<body>

</body>

</html>
