<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="iconfont.css"> <!-- 接入字体图标文件的引用 -->
    <style>
        .icon1 {/* 由于字体图标经常默认定义字体大小，想要重新定义大小需要在引用时重新定义一个子类，用以调整字体大小 */
            font-size: 50px;
            color: blue;
        }
        .icon2 {
            font-size: 100px;
            color: red;
        }
    </style>
</head>

<body>
    <span class="iconfont icon-sheji_huatu icon1" ></span> <!-- 定义字体图标引用 -->
    <span class="iconfont icon-AIhuatu icon2" ></span>
    <span></span>
    <span></span>
</body>

</html>
